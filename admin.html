<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Borges Barber</title>
  <link rel="icon" href="logo-removebg-preview.png" type="image/png" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-bg-bars" aria-hidden="true"></div>
    <div class="login-box">
      <div class="login-logo-wrap">
        <img src="logo sem fundo.png" alt="Borges Barber" class="login-logo" />
      </div>
      <h1>Painel Admin</h1>
      <p class="login-sub">Borges Barber · Florianópolis</p>

      <form id="login-form">
        <div class="pwd-wrap">
          <input type="password" id="login-pwd" placeholder="Senha de acesso" autocomplete="current-password" required />
          <button type="button" class="btn-eye" id="btn-eye" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <button type="submit" id="btn-entrar">
          <span id="btn-entrar-text">Entrar</span>
          <span id="btn-entrar-spin" class="spinner" hidden></span>
        </button>
      </form>

      <p id="login-err" class="err-msg" hidden></p>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="painel" hidden>

    <header class="admin-header">
      <div class="admin-header-left">
        <img src="logo sem fundo.png" alt="Logo" class="admin-logo" />
        <div class="admin-header-title">
          <span class="admin-header-brand">Borges Barber</span>
          <span class="admin-header-sub">Painel Admin</span>
        </div>
      </div>
      <div class="admin-header-right">
        <a href="index.html" target="_blank" class="btn-ghost" aria-label="Ver site">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span class="btn-ghost-label">Site</span>
        </a>
        <button id="btn-logout" class="btn-ghost" aria-label="Sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="btn-ghost-label">Sair</span>
        </button>
      </div>
    </header>

    <main class="admin-main">

      <!-- FORMULÁRIO NOVA FOTO -->
      <section class="card form-card">
        <button class="form-toggle-btn" id="form-toggle" aria-expanded="true" aria-controls="form-body">
          <div class="form-toggle-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
            <span>Adicionar foto</span>
          </div>
          <svg class="toggle-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <div class="form-body" id="form-body">
          <div class="form-grid">

            <div class="field full">
              <label for="f-url">URL da imagem <span class="hint">— cole o link direto</span></label>
              <input type="url" id="f-url" placeholder="https://exemplo.com/foto.jpg" autocomplete="off" />
            </div>

            <div class="field full separator-or"><span>ou faça upload</span></div>

            <div class="field full">
              <label>Arquivo local</label>
              <div class="upload-area" id="upload-area">
                <input type="file" id="f-file" accept="image/*" hidden />
                <div class="upload-inner" id="upload-trigger">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><rect x="3" y="14" width="18" height="7" rx="2"/></svg>
                  <span>Clique ou arraste a foto aqui</span>
                </div>
                <div class="upload-preview" id="upload-preview" hidden>
                  <img id="preview-img" src="" alt="Preview" />
                  <button type="button" id="clear-upload" class="btn-clear-upload" aria-label="Remover imagem">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="field">
              <label for="f-cat">Categoria</label>
              <select id="f-cat">
                <option value="corte">Corte + Fade</option>
                <option value="barba">Barba</option>
                <option value="ambiente">Ambiente</option>
                <option value="antes_depois">Before / After</option>
                <option value="acabamento">Acabamento</option>
              </select>
            </div>

            <div class="field">
              <label for="f-titulo">Legenda <span class="hint">(opcional)</span></label>
              <input type="text" id="f-titulo" placeholder="Ex: Degradê completo" maxlength="60" />
            </div>

            <div class="field full">
              <button type="button" id="btn-add" class="btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 5v14M5 12h14"/></svg>
                Adicionar foto
              </button>
            </div>

          </div>
          <div id="form-status" class="form-status" hidden></div>
        </div>
      </section>

      <!-- FILTROS -->
      <div class="filters-wrap">
        <div class="filters" role="group" aria-label="Filtrar por categoria">
          <button class="filter-btn active" data-cat="todas">Todas</button>
          <button class="filter-btn" data-cat="corte">Corte</button>
          <button class="filter-btn" data-cat="barba">Barba</button>
          <button class="filter-btn" data-cat="ambiente">Ambiente</button>
          <button class="filter-btn" data-cat="antes_depois">Before/After</button>
          <button class="filter-btn" data-cat="acabamento">Acabamento</button>
        </div>
      </div>

      <!-- GRID DE FOTOS -->
      <section class="fotos-grid" id="fotos-grid" aria-label="Galeria de fotos">
        <div class="loading-msg" id="loading-msg">Carregando fotos...</div>
      </section>

    </main>
  </div>

  <script src="admin.js"></script>
  <script>
    // Toggle collapse do formulário
    const formToggle = document.getElementById('form-toggle');
    const formBody   = document.getElementById('form-body');
    formToggle.addEventListener('click', () => {
      const open = formToggle.getAttribute('aria-expanded') === 'true';
      formToggle.setAttribute('aria-expanded', String(!open));
      formBody.classList.toggle('collapsed', open);
    });
    // Fecha por padrão no mobile
    if (window.innerWidth < 768) {
      formToggle.setAttribute('aria-expanded', 'false');
      formBody.classList.add('collapsed');
    }
  </script>
</body>
</html>
